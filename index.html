<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Half Adder Web</title>
    <style>
        :root {
            --background-color: #ffffff;
            --text-color: #1a1a1a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #121212;
                --text-color: #f5f5f5;
            }
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s; 
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 2rem;
        }

        h1, p {
            color: var(--text-color);
            text-align: center;
        }

        .div-mid {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 80vh;
        }
    </style>
</head>
<body>
    <div class="div-mid">
        <h1>Half Adder</h1>
        <p>
            Welcome to my project, I'm a person who likes programming and electronics. And this is my half adder, 
            let's have some fun!
        </p>
    </div>
</body>
</html>
